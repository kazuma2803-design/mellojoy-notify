name: Mellojoy TikTok Notify

on:
  schedule:
    # 朝：どれか1つが起動すれば12:30まで居続けて1分ごとにチェック
    # （GitHubは定期実行を飛ばすことがあるので保険で何回も起動をかける）
    # 時刻はUTC（日本時間 = UTC+9）→ 日本時間 8:30, 9:00, 9:20, 9:40, 10:00, 10:20, 10:40, 11:00, 11:30
    - cron: "30 23 * * *"
    - cron: "0,20,40 0 * * *"
    - cron: "0,20,40 1 * * *"
    - cron: "0,30 2 * * *"
    # 昼〜夜：1時間ごとに1回だけチェック
    - cron: "0 4-14 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知（最新投稿を日付関係なくDiscordに送る）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mellojoy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp
      - name: Check TikTok
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # GitHubからだとTikTokがブラウザ方式に空の一覧しか返さないのでオフ
          PW_DISABLE: "1"
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python mellojoy_tiktok_notify.py --test-latest
          else
            python mellojoy_tiktok_notify.py --auto
          fi
