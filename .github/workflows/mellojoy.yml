name: Mellojoy TikTok Notify

on:
  schedule:
    # 日本時間 9:45〜12:55 の間、5分ごと（GitHubの時刻はUTC = 日本時間-9時間）
    - cron: "45-59/5 0 * * *"
    - cron: "*/5 1-3 * * *"
    # それ以外の投稿も拾うため、日中は1時間ごと
    - cron: "0 4-14 * * *"
  workflow_dispatch:      # 手動実行ボタン
    inputs:
      test:
        description: "テスト通知（最新投稿を日付関係なくDiscordに送る）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mellojoy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U yt-dlp playwright
      - name: Check TikTok
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python mellojoy_tiktok_notify.py --test-latest
          else
            python mellojoy_tiktok_notify.py --once
          fi
      - name: Save state
        run: |
          git config user.name "mellojoy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add mellojoy_tiktok_state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
